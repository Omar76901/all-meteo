server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # non dichiarare la versione di nginx negli header e nelle pagine di errore
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # il service worker non va cachato: deve poter aggiornare l'app
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # gli asset hanno hash nel nome: cache lunga e immutabile
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: ogni percorso torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
