# Controllo giornaliero dei servizi esterni (API meteo, radar, tile della mappa).
# Se uno cambia o smette di funzionare il job fallisce e GitHub manda una mail.
name: Servizi esterni

on:
  schedule:
    - cron: "17 6 * * *" # ogni giorno alle 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verifica API e tile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Controlla i servizi esterni
        run: node scripts/check-upstreams.mjs
