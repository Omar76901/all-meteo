# Header di sicurezza, inclusi in ogni location di nginx.conf: in nginx un add_header
# dentro una location annulla tutti quelli ereditati dal server, quindi vanno ripetuti.

# la CSP completa è nel <meta> di index.html; frame-ancestors lì viene ignorato,
# quindi l'anti-clickjacking va mandato come header
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# solo la geolocalizzazione (pulsante 📍) serve all'app
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), bluetooth=(), serial=()" always;
